<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask a Question</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Ask an anonymous question</h1>
    <p class="subtitle" id="subtitle">Your question goes straight to the teacher. No name, no login &mdash; just ask.</p>

    <textarea id="questionText" placeholder="Type your question about the class here..." maxlength="1000"></textarea>
    <div>
      <button id="submitBtn">Send question</button>
    </div>
    <div class="message" id="message"></div>
  </div>

  <script src="config.js"></script>
  <script src="student.js"></script>
</body>
</html>
